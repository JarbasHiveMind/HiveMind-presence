name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      package_name: 'HiveMind_presence'
      version_file: 'hivemind_presence/version.py'
