name: Lint

on:
  pull_request:
    branches: [ dev, master ]
  push:
    branches: [ dev ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          # E501: line too long, W503: line break before binary operator, E203: whitespace before ':'
          flake8 hivemind_presence --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 hivemind_presence --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
