[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-presence"
dynamic = ["version"]
description = "Presence detection for HiveMind mesh network"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "upnpclient>=0.0.8",
    "hivemind_bus_client>=0.7.0a2",
    "rich",
]

[project.optional-dependencies]
# The e2e suite (tests/e2e/) drives connection-presence through an in-process
# hivescope hive. hivescope is published; the prerelease floor below lets a
# plain `pip install .[test]` resolve the 2.x hivemind stack with no --pre
# (PEP 440: a prerelease floor opts that package into prereleases).
test = [
    "pytest",
    "hivescope>=0.5.2a1",
    "ovos-bus-client>=2.0.0a3,<3.0.0",
    # zeroconf drives the real advertise<->discover e2e (tests/e2e/test_discovery.py);
    # it is an optional (LGPL) transport for end users but required to exercise it.
    "zeroconf",
]

[project.scripts]
hivemind-presence = "hivemind_presence.scripts:hmpresence_cmds"

[tool.setuptools]
packages = ["hivemind_presence"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "hivemind_presence.version.__version__"}

[tool.pytest.ini_options]
# hivescope's fixtures used to load through `pytest_plugins` in a conftest.py
# at the repository ROOT. pytest only accepts that key in a top-level conftest,
# and a conftest at the root puts the root on sys.path, which shadows the
# installed wheel with the working tree. `-p` loads the same plugin with no
# file at the root. hivescope stays a declared test dependency, so a missing
# install still fails loudly.
addopts = "-p hivescope.pytest_fixtures"
